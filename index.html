<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دار حواديت | نظام الإدارة</title>
<link rel="icon" href="logo.jpg"><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="login" class="login"><div class="login-card">
<img src="logo.jpg" class="logo"><h1>دار حواديت</h1><div class="slogan">حواديت متع عقلك</div>
<div id="configBox"></div>
<form id="loginForm"><label>اسم المستخدم<input id="username" required autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="current-password"></label><button class="primary wide">دخول</button><div id="loginError" class="error"></div></form>
</div></div>
<div id="app" class="hidden">
<aside class="side"><div class="brand"><img src="logo.jpg"><div><b>دار حواديت</b><span>حواديت متع عقلك</span></div></div><nav id="nav"></nav><div class="me"><div id="meAvatar" class="avatar">ح</div><div><b id="meName">—</b><span id="meRole">—</span></div><button id="logout" class="icon">↪</button></div></aside>
<main><header><div><h2 id="title">لوحة التحكم</h2><p>نظام إدارة دار حواديت للنشر</p></div><div class="header-actions"><select id="warehouseSelect"></select><button id="refresh" class="btn">↻ تحديث</button></div></header><div id="pages"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button id="closeModal" class="icon">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div><div id="print" class="hidden"></div>
<script type="module" src="app.js"></script>
</body></html>
